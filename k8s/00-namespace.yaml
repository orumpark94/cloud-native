# 서점 앱이 들어갈 네임스페이스
#
# 왜 default 를 안 쓰는가                                 ★ 2단계에서 확인한 것
#   Namespace 는 격리가 아니다. 이름 충돌을 막는 구획일 뿐이다
#     네트워크는 안 막힌다 (NetworkPolicy 가 따로 필요하다)
#     리소스도 안 막힌다 (ResourceQuota 가 따로 필요하다)
#
#   그래도 나누는 이유
#     kubectl delete namespace 하나로 전부 지울 수 있다
#     → 실험을 반복할 때 이게 결정적이다
#     → 방금 k8s-lab 을 그렇게 정리했다
#
#     그리고 "무엇이 이 앱의 것인가" 가 눈으로 구분된다
#
# label 을 붙여두는 이유
#   나중에 NetworkPolicy 나 모니터링 대상을 고를 때
#   namespaceSelector 로 이 label 을 쓴다
#   → 이름으로 고르면 이름이 바뀔 때 다 깨진다
apiVersion: v1
kind: Namespace
metadata:
  name: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
    # 이 네임스페이스가 어느 단계의 것인지 남겨둔다
    stage: "04"
