# PostgreSQL 데이터용 PersistentVolume
#
# ★ 왜 손으로 만드는가
#   이 클러스터에는 StorageClass 가 없다
#   → 동적 프로비저닝이 안 된다
#   → PVC 를 만들어도 붙을 PV 가 저절로 생기지 않는다
#
#   local-path-provisioner 같은 걸 깔면 자동이 되지만 지금은 안 깐다
#   → "PV 가 어떻게 만들어지는가" 가 가려진다
#   → 손으로 만들어보고, 번거로우면 그때 도입한다
#
#
# hostPath 가 아니라 local 을 쓰는 이유                    ★★
#
#   hostPath   경로만 지정한다. 어느 노드인지 모른다
#              → Pod 가 다른 노드에 뜨면 "빈 디렉터리" 를 본다
#              → 데이터가 사라진 것처럼 보인다 (실제로는 다른 노드에 있다)
#              → 2단계 09편에서 실제로 겪은 상황이다
#
#   local      nodeAffinity 를 필수로 요구한다
#              → Scheduler 가 그 노드로만 Pod 를 보낸다
#              → 조용한 데이터 손실을 구조적으로 막는다
#
#
# 그리고 이 안전장치가 동시에 족쇄가 된다                   ★
#   worker01 이 죽으면 PostgreSQL Pod 는 어디로도 못 간다
#   → Pending 상태로 남는다. 다른 노드에 뜨지 못한다
#   → 이게 "DB 를 Kubernetes 에 올려도 되는가" 의 핵심 쟁점이다 (2단계 11편)
#   → 4단계 후반에 worker01 을 꺼서 직접 확인한다
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bookstore-pgdata
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  capacity:
    storage: 5Gi
    # 5Gi 인 이유
    #   책 1,000권 + 주문 데이터는 수십 MB 면 충분하다
    #   6단계에서 데이터를 늘려 인덱스 효과를 잴 예정이라 여유를 둔다
    #
    #   ★ local 볼륨에서 이 값은 "선언" 일 뿐이다
    #     실제로 5Gi 를 예약하지 않는다. 디스크가 차면 그냥 찬다
    #     → 클라우드의 EBS 와 다른 점이다

  accessModes:
    - ReadWriteOnce
    # RWO 는 "Pod 하나만" 이 아니라 "노드 하나만" 이다     ★ 2단계 13편에서 확인
    #   같은 노드의 여러 Pod 가 동시에 붙을 수 있다
    #   → 백업 CronJob 이 db-0 의 PVC 를 읽을 수 있었던 이유

  persistentVolumeReclaimPolicy: Retain
    # Delete 로 두면 PVC 를 지울 때 데이터가 같이 사라진다
    # Retain 이면 PV 가 Released 로 남고 데이터는 보존된다
    #
    # ★ 대가가 있다
    #   Released 상태의 PV 는 재사용할 수 없다
    #   claimRef 에 지워진 PVC 정보가 남아 새 PVC 가 못 붙는다
    #   → 방금 2단계 PV 3개를 그래서 지웠다

  # storageClassName 을 비워둔다
  #   PVC 쪽도 storageClassName: "" 로 맞춰야 붙는다
  #   → "동적 프로비저닝을 쓰지 않겠다" 는 명시적 선언이다
  storageClassName: ""

  local:
    path: /mnt/disks/pgdata

  # ★ local 볼륨은 nodeAffinity 가 필수다. 없으면 생성이 거부된다
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - worker01
