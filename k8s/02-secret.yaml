# 비밀 값
#
# ★★ Secret 은 암호화가 아니다                            (2단계에서 확인한 것)
#
#   etcd 에 base64 로 저장된다. base64 는 인코딩이지 암호화가 아니다
#   → kubectl get secret -o yaml 하고 디코드하면 그대로 보인다
#   → 그런데도 Secret 을 쓰는 이유가 있다
#
#     1. RBAC 을 따로 걸 수 있다
#        ConfigMap 은 읽어도 되지만 Secret 은 못 읽게 나눌 수 있다
#     2. kubectl describe 에 값이 안 찍힌다
#        ConfigMap 은 그대로 보인다 → 화면 공유하다 새어나간다
#     3. 로그와 이벤트에 안 남는다
#     4. etcd 저장 시 암호화(EncryptionConfiguration)를 켤 수 있다
#
#   → "Secret 에 넣었으니 안전하다" 는 틀렸다
#   → "Secret 에 넣었으니 통제할 수 있다" 가 맞다
#
#
# ★ 이 파일을 Git 에 올리면 안 된다는 게 원래 규칙이다
#
#   그런데 이 프로젝트는 학습용이고 저장소가 public 이다
#   → 이 값은 VM 안에서만 쓰이는 값이라 실질적 위험이 없다
#   → 대신 "실무라면 이렇게 안 한다" 를 여기 적어둔다
#
#   [실무에서 쓰는 방법]
#     External Secrets Operator + AWS Secrets Manager
#     Sealed Secrets (암호화된 상태로 Git 에 올림)
#     SOPS
#     → 9단계 이후에 다룬다
#
#
# stringData 를 쓰는 이유
#   data 는 base64 로 직접 인코딩해서 넣어야 한다 → 읽기 어렵고 실수한다
#   stringData 는 평문으로 쓰면 API Server 가 인코딩해준다
#   → 저장되는 결과는 완전히 같다
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-secret
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
type: Opaque
stringData:
  # ── 앱이 쓰는 값 ────────────────────────────────────
  #
  # URL 을 통째로 담는다                                  ★ 02 문서
  #   host / port / user / password 를 따로 받지 않는다
  #   → sslmode 하나로 TLS 여부가 정해진다
  #   → 로컬(평문)과 RDS(TLS)에서 같은 코드가 돈다
  #
  # postgres 는 Headless Service 이름이다
  #   StatefulSet 이므로 postgres-0.postgres 로도 붙을 수 있다
  #   지금은 replica 가 1개라 Service 이름으로 충분하다
  DATABASE_URL: "postgresql://bookstore:bookstore_local_only@postgres:5432/bookstore"

  # ── PostgreSQL 컨테이너가 쓰는 값 ───────────────────
  #
  # 위 URL 의 비밀번호와 반드시 같아야 한다
  # ★ 두 곳에 같은 값이 적히는 구조다
  #   한쪽만 고치면 앱이 붙지 못한다
  #   → 실무에서는 Operator 나 External Secrets 가 이걸 한 곳으로 모은다
  #   → 지금은 손으로 맞춘다. 이 불편함 자체가 나중의 근거가 된다
  POSTGRES_PASSWORD: "bookstore_local_only"
